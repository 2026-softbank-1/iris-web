<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  #root { padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 14px 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--grey-700); }
  .cap { font-size: 9px; color: var(--text-quaternary); font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon, ICON_ALIASES } = window.TossDesignSystemTDS_d2de50;
  const names = Object.keys(ICON_ALIASES).filter((n,i,a)=>a.indexOf(ICON_ALIASES[n])===a.findIndex(x=>ICON_ALIASES[x]===ICON_ALIASES[n]));
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div className="grid">
      {names.map((n) => (
        <div className="cell" key={n}>
          <Icon name={n} size={24} />
          <span className="cap">{n}</span>
        </div>
      ))}
    </div>
  );
</script>
</body>
</html>
