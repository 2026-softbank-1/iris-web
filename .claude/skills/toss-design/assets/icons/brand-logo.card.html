<!-- @dsCard group="Brand" viewport="700x200" name="Logo & symbol" subtitle="The Toss 3D symbol and wordmark; clear-space and color rules" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;}
  .wrap{display:flex;gap:24px;align-items:stretch;}
  .panel{flex:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;}
  .cap{font-size:11px;font-weight:600;color:var(--text-quaternary);}
  .wordmark{font-size:44px;font-weight:800;letter-spacing:-0.04em;color:var(--blue-500);}
  .wordmark-w{color:#fff;}
</style></head>
<body>
<div class="wrap">
  <div class="panel" style="background:var(--grey-50);border:1px solid var(--border-default);">
    <img src="../brand/toss-symbol.png" alt="Toss symbol" style="height:84px;width:auto;">
    <span class="cap">Symbol · on light</span>
  </div>
  <div class="panel" style="background:var(--grey-50);border:1px solid var(--border-default);">
    <span class="wordmark">toss</span>
    <span class="cap">Wordmark · Blue 500</span>
  </div>
  <div class="panel" style="background:var(--blue-500);">
    <span class="wordmark wordmark-w">toss</span>
    <span class="cap" style="color:rgba(255,255,255,0.8)">Wordmark · reversed</span>
  </div>
</div>
</body></html>
