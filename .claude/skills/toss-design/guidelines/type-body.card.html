<!-- @dsCard group="Type" viewport="700x220" name="Body · Label · Caption" subtitle="Reading text, dense UI labels, and helper captions" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;color:var(--text-primary);}
  .row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--grey-100);}
  .row:last-child{border:none;}
  .meta{margin-left:auto;font-size:11px;color:var(--text-quaternary);font-weight:500;white-space:nowrap;}
  .s{letter-spacing:-0.01em;}
</style></head>
<body>
  <div class="row"><span class="s" style="font-size:17px;font-weight:400;line-height:1.5">토스로 더 쉽고 안전하게 금융을 즐겨보세요.</span><span class="meta">Body 1 · 17/400</span></div>
  <div class="row"><span class="s" style="font-size:15px;font-weight:400;line-height:1.55;color:var(--text-secondary)">계좌를 연결하면 자산이 자동으로 모여요.</span><span class="meta">Body 2 · 15/400</span></div>
  <div class="row"><span class="s" style="font-size:15px;font-weight:600;line-height:1.4">송금하기</span><span class="meta">Label 1 · 15/600</span></div>
  <div class="row"><span class="s" style="font-size:13px;font-weight:500;line-height:1.4;color:var(--text-tertiary)">최근 거래 · 3건</span><span class="meta">Label 2 · 13/500</span></div>
  <div class="row"><span class="s" style="font-size:13px;font-weight:400;line-height:1.35;color:var(--text-quaternary)">수수료는 토스가 부담해요</span><span class="meta">Caption 1 · 13/400</span></div>
  <div class="row"><span class="s" style="font-size:11px;font-weight:500;line-height:1.3;color:var(--text-quaternary)">2026.06.19 14:32</span><span class="meta">Caption 3 · 11/500</span></div>
</body></html>
