<!-- @dsCard group="Colors" viewport="700x150" name="Grey scale" subtitle="The workhorse neutrals — text, surfaces, borders" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;}
  .scale{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--grey-200);}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;}
  .n{font-size:11px;font-weight:700;}
  .h{font-size:10px;font-weight:500;opacity:0.85;}
</style></head>
<body>
<div class="scale">
  <div class="sw" style="background:var(--grey-50)"><span class="n" style="color:var(--grey-600)">50</span><span class="h" style="color:var(--grey-500)">F9FAFB</span></div>
  <div class="sw" style="background:var(--grey-100)"><span class="n" style="color:var(--grey-600)">100</span><span class="h" style="color:var(--grey-500)">F2F4F6</span></div>
  <div class="sw" style="background:var(--grey-200)"><span class="n" style="color:var(--grey-700)">200</span><span class="h" style="color:var(--grey-600)">E5E8EB</span></div>
  <div class="sw" style="background:var(--grey-300)"><span class="n" style="color:var(--grey-800)">300</span><span class="h" style="color:var(--grey-700)">D1D6DB</span></div>
  <div class="sw" style="background:var(--grey-400)"><span class="n" style="color:#fff">400</span><span class="h" style="color:#fff">B0B8C1</span></div>
  <div class="sw" style="background:var(--grey-500)"><span class="n" style="color:#fff">500</span><span class="h" style="color:#fff">8B95A1</span></div>
  <div class="sw" style="background:var(--grey-600)"><span class="n" style="color:#fff">600</span><span class="h" style="color:#fff">6B7684</span></div>
  <div class="sw" style="background:var(--grey-700)"><span class="n" style="color:#fff">700</span><span class="h" style="color:#fff">4E5968</span></div>
  <div class="sw" style="background:var(--grey-800)"><span class="n" style="color:#fff">800</span><span class="h" style="color:#fff">333D4B</span></div>
  <div class="sw" style="background:var(--grey-900)"><span class="n" style="color:#fff">900</span><span class="h" style="color:#fff">191F28</span></div>
</div>
</body></html>
