<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid; 24px is the default mobile side padding" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;}
  .row{display:flex;align-items:center;gap:14px;padding:3px 0;}
  .bar{height:16px;background:var(--blue-400);border-radius:3px;}
  .l{font-size:12px;font-weight:600;color:var(--text-primary);width:64px;}
  .s{font-size:11px;color:var(--text-quaternary);font-weight:500;}
</style></head>
<body>
  <div class="row"><span class="l">space-4</span><span class="bar" style="width:4px"></span><span class="s">4 · icon gaps</span></div>
  <div class="row"><span class="l">space-8</span><span class="bar" style="width:8px"></span><span class="s">8 · inline</span></div>
  <div class="row"><span class="l">space-12</span><span class="bar" style="width:12px"></span><span class="s">12 · between controls</span></div>
  <div class="row"><span class="l">space-16</span><span class="bar" style="width:16px"></span><span class="s">16 · row padding</span></div>
  <div class="row"><span class="l">space-20</span><span class="bar" style="width:20px"></span><span class="s">20 · card padding</span></div>
  <div class="row"><span class="l">space-24</span><span class="bar" style="width:24px"></span><span class="s">24 · screen side padding (default)</span></div>
  <div class="row"><span class="l">space-32</span><span class="bar" style="width:32px"></span><span class="s">32 · section gaps</span></div>
</body></html>
