<!-- @dsCard group="Type" viewport="700x150" name="Weights & numerals" subtitle="Four weights; numerals are emphasised across Toss" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;color:var(--text-strong);}
  .wrap{display:flex;gap:18px;align-items:flex-end;}
  .w{flex:1;text-align:center;}
  .ex{font-size:30px;letter-spacing:-0.02em;}
  .nm{font-size:11px;font-weight:600;color:var(--text-quaternary);margin-top:8px;}
  .num{margin-top:18px;font-size:13px;color:var(--text-tertiary);font-weight:500;}
</style></head>
<body>
  <div class="wrap">
    <div class="w"><div class="ex" style="font-weight:400">Aa 가나</div><div class="nm">Regular · 400</div></div>
    <div class="w"><div class="ex" style="font-weight:500">Aa 가나</div><div class="nm">Medium · 500</div></div>
    <div class="w"><div class="ex" style="font-weight:600">Aa 가나</div><div class="nm">Semibold · 600</div></div>
    <div class="w"><div class="ex" style="font-weight:700">Aa 가나</div><div class="nm">Bold · 700</div></div>
  </div>
  <div class="num">Numerals · <b style="font-weight:700">1,250,000원</b> · +12.4% · 2026.06.19 — set tight and bold for amounts</div>
</body></html>
