<!-- @dsCard group="Type" viewport="700x230" name="Display & Title" subtitle="Headlines and section headers — Pretendard, tight tracking" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;color:var(--text-strong);}
  .row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--grey-100);}
  .row:last-child{border:none;}
  .meta{margin-left:auto;font-size:11px;color:var(--text-quaternary);font-weight:500;white-space:nowrap;letter-spacing:0;}
  .specimen{letter-spacing:-0.02em;}
</style></head>
<body>
  <div class="row"><span class="specimen" style="font-size:36px;font-weight:700;line-height:1.1">9,840,200원</span><span class="meta">Display 1 · 36/700</span></div>
  <div class="row"><span class="specimen" style="font-size:28px;font-weight:700;line-height:1.15">간편하게 송금하기</span><span class="meta">Display 2 · 28/700</span></div>
  <div class="row"><span class="specimen" style="font-size:24px;font-weight:700;line-height:1.3">내 자산 한눈에 보기</span><span class="meta">Title 1 · 24/700</span></div>
  <div class="row"><span class="specimen" style="font-size:21px;font-weight:700;line-height:1.4">이번 달 소비 리포트</span><span class="meta">Title 2 · 21/700</span></div>
  <div class="row"><span class="specimen" style="font-size:18px;font-weight:600;line-height:1.45">최근 거래 내역</span><span class="meta">Title 3 · 18/600</span></div>
</body></html>
