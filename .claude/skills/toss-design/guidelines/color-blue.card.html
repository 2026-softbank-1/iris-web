<!-- @dsCard group="Colors" viewport="700x150" name="Toss Blue (Primary)" subtitle="Brand blue scale · 500 is the primary action color" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;}
  .scale{display:flex;gap:0;border-radius:12px;overflow:hidden;}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;}
  .n{font-size:11px;font-weight:700;}
  .h{font-size:10px;font-weight:500;opacity:0.85;}
  .star{position:absolute;margin:-6px 0 0 6px;font-size:10px;font-weight:700;color:#fff;}
</style></head>
<body>
<div class="scale">
  <div class="sw" style="background:var(--blue-50)"><span class="n" style="color:var(--blue-700)">50</span><span class="h" style="color:var(--blue-700)">#E8F3FF</span></div>
  <div class="sw" style="background:var(--blue-100)"><span class="n" style="color:var(--blue-700)">100</span><span class="h" style="color:var(--blue-700)">#C9E2FF</span></div>
  <div class="sw" style="background:var(--blue-200)"><span class="n" style="color:var(--blue-800)">200</span><span class="h" style="color:var(--blue-800)">#90C2FF</span></div>
  <div class="sw" style="background:var(--blue-300)"><span class="n" style="color:#fff">300</span><span class="h" style="color:#fff">#64A8FF</span></div>
  <div class="sw" style="background:var(--blue-400)"><span class="n" style="color:#fff">400</span><span class="h" style="color:#fff">#4593FC</span></div>
  <div class="sw" style="background:var(--blue-500)"><span class="n" style="color:#fff">500 ★</span><span class="h" style="color:#fff">#3182F6</span></div>
  <div class="sw" style="background:var(--blue-600)"><span class="n" style="color:#fff">600</span><span class="h" style="color:#fff">#2272EB</span></div>
  <div class="sw" style="background:var(--blue-700)"><span class="n" style="color:#fff">700</span><span class="h" style="color:#fff">#1B64DA</span></div>
  <div class="sw" style="background:var(--blue-800)"><span class="n" style="color:#fff">800</span><span class="h" style="color:#fff">#1957C2</span></div>
  <div class="sw" style="background:var(--blue-900)"><span class="n" style="color:#fff">900</span><span class="h" style="color:#fff">#194AA6</span></div>
</div>
</body></html>
