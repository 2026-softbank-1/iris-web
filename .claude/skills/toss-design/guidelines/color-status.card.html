<!-- @dsCard group="Colors" viewport="700x150" name="Status & semantic" subtitle="Success · danger · warning · info, plus Toss heritage yellow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .cell{display:flex;flex-direction:column;gap:6px;}
  .sw{height:64px;border-radius:12px;}
  .l{font-size:12px;font-weight:700;color:var(--text-primary);}
  .s{font-size:10px;font-weight:500;color:var(--text-quaternary);}
</style></head>
<body>
<div class="grid">
  <div class="cell"><div class="sw" style="background:var(--green-500)"></div><span class="l">Success</span><span class="s">#03B26C</span></div>
  <div class="cell"><div class="sw" style="background:var(--red-500)"></div><span class="l">Danger</span><span class="s">#F04452</span></div>
  <div class="cell"><div class="sw" style="background:var(--yellow-500)"></div><span class="l">Warning</span><span class="s">#FFB331</span></div>
  <div class="cell"><div class="sw" style="background:var(--blue-500)"></div><span class="l">Info</span><span class="s">#3182F6</span></div>
  <div class="cell"><div class="sw" style="background:var(--teal-600)"></div><span class="l">Teal</span><span class="s">#2BC4C4</span></div>
  <div class="cell"><div class="sw" style="background:var(--toss-yellow)"></div><span class="l">Toss Yellow</span><span class="s">#FFC84D</span></div>
</div>
</body></html>
