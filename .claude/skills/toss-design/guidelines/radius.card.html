<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radius" subtitle="Soft, generous radii — 14–24 for cards, full for pills" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px;}
  .row{display:flex;gap:20px;align-items:flex-end;}
  .cell{text-align:center;}
  .box{width:84px;height:64px;background:var(--blue-50);border:1.5px solid var(--blue-300);}
  .l{font-size:12px;font-weight:700;color:var(--text-primary);margin-top:8px;}
  .s{font-size:10px;font-weight:500;color:var(--text-quaternary);}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:14px"></div><div class="l">xxs</div><div class="s">14px</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="l">xs</div><div class="s">16px</div></div>
  <div class="cell"><div class="box" style="border-radius:18px"></div><div class="l">s</div><div class="s">18px</div></div>
  <div class="cell"><div class="box" style="border-radius:20px"></div><div class="l">m</div><div class="s">20px · card</div></div>
  <div class="cell"><div class="box" style="border-radius:24px"></div><div class="l">l</div><div class="s">24px · sheet</div></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><div class="l">full</div><div class="s">pill / chip</div></div>
</div>
</body></html>
