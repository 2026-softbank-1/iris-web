<!-- @dsCard group="Components" viewport="700x560" name="Badge · Chip · ListRow · Card" subtitle="Content display primitives" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-page); color: var(--text-primary); }
  #root { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--text-quaternary); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Badge, Chip, ListRow, Card, Icon } = window.TossDesignSystemTDS_d2de50;
  function IconTile({ name, bg }) {
    return (
      <div style={{ width: 40, height: 40, borderRadius: 12, background: bg || 'var(--grey-100)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--icon-default)' }}>
        <Icon name={name} size={22} />
      </div>
    );
  }
  function Demo() {
    const [sel, setSel] = React.useState('전체');
    return (
      <div>
        <div>
          <p className="lbl">Badge — weak & fill</p>
          <div className="row">
            <Badge color="blue">NEW</Badge>
            <Badge color="red">실시간</Badge>
            <Badge color="green">+2.4%</Badge>
            <Badge color="teal">이벤트</Badge>
            <Badge color="yellow" variant="fill">혜택</Badge>
            <Badge color="grey">광고</Badge>
          </div>
        </div>
        <div>
          <p className="lbl">Chip — selectable</p>
          <div className="row">
            {['전체', '입금', '출금', '카드'].map((c) => (
              <Chip key={c} selected={sel === c} onClick={() => setSel(c)}>{c}</Chip>
            ))}
            <Chip leadingIcon={<Icon name="filter" size={15} />}>필터</Chip>
          </div>
        </div>
        <div>
          <p className="lbl">ListRow inside a Card</p>
          <Card padding={8} style={{ maxWidth: 420 }}>
            <div style={{ padding: '0 12px' }}>
              <ListRow left={<IconTile name="bank" bg="#E8F3FF" />} title="예시은행 입출금" description="1234-56-789012" right={<span style={{ fontSize: 15, fontWeight: 700 }}>1,250,000원</span>} onClick={() => {}} />
              <ListRow left={<IconTile name="card" bg="#F2F4F6" />} title="예시카드" description="이번 달 사용 412,000원" arrow onClick={() => {}} />
              <ListRow left={<IconTile name="chart" bg="#E8F3FF" />} title="내 투자" right={<Badge color="green">+5.1%</Badge>} arrow onClick={() => {}} />
            </div>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
