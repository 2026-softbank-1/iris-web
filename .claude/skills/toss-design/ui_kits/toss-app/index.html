<!-- @startingPoint section="Toss App" subtitle="Mobile super-app: home, send-money keypad, invest, pay" viewport="390x844" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toss App — UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: var(--font-sans); background: var(--grey-200); }
  #stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .phone { width: 390px; height: 780px; background: #fff; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 24px 70px rgba(0,0,0,0.25); border: 8px solid #111; }
  .statusbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 14px; font-weight: 700; color: var(--text-strong); position: relative; z-index: 5; }
  .screen { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen.with-tabs { bottom: 64px; }
  .tabbar-wrap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="SendScreen.jsx"></script>
<script type="text/babel" src="StockScreen.jsx"></script>
<script type="text/babel">
  const { TabBar, Icon, Card, Badge } = window.TossDesignSystemTDS_d2de50;

  function PayScreen() {
    return (
      <div style={{ background: 'var(--grey-900)', minHeight: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '28px 24px' }}>
        <div style={{ color: '#fff', fontSize: 18, fontWeight: 700, marginBottom: 4 }}>토스페이</div>
        <div style={{ color: 'rgba(255,255,255,0.6)', fontSize: 13, fontWeight: 500, marginBottom: 28 }}>매장에서 QR을 보여주세요</div>
        <div style={{ background: '#fff', borderRadius: 24, padding: 24, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <Icon name="qr" size={180} color="var(--grey-900)" />
          <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-strong)' }}>토스머니 38,200원</div>
        </div>
        <div style={{ marginTop: 24, display: 'flex', gap: 10 }}>
          <Badge color="blue" variant="fill">결제 즉시 캐시백</Badge>
        </div>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = React.useState('home');
    const [sending, setSending] = React.useState(false);
    const [toast, setToast] = React.useState(false);

    const screen = sending ? (
      <window.SendScreen onBack={() => setSending(false)} onComplete={() => { setSending(false); setToast(true); setTimeout(() => setToast(false), 2200); }} />
    ) : tab === 'home' ? (
      <window.HomeScreen onOpenSend={() => setSending(true)} onOpenAccount={() => setSending(true)} />
    ) : tab === 'invest' ? (
      <window.StockScreen />
    ) : tab === 'pay' ? <PayScreen /> : (
      <div style={{ padding: 40, textAlign: 'center', color: 'var(--text-quaternary)', fontWeight: 600 }}>전체 메뉴</div>
    );

    const showTabs = !sending;

    return (
      <div className="phone">
        <div className="statusbar" style={tab === 'pay' && !sending ? { color: '#fff' } : {}}>
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <span style={{ fontSize: 12 }}>5G</span>
            <span style={{ width: 22, height: 11, border: `1.5px solid currentColor`, borderRadius: 3, display: 'inline-block', position: 'relative', opacity: 0.9 }}>
              <span style={{ position: 'absolute', inset: 1.5, right: 6, background: 'currentColor', borderRadius: 1 }}></span>
            </span>
          </span>
        </div>
        <div className={showTabs ? 'screen with-tabs' : 'screen'} key={sending ? 'send' : tab}>
          {screen}
        </div>
        {showTabs && (
          <div className="tabbar-wrap">
            <TabBar value={tab} onChange={setTab} items={[
              { key: 'home', label: '홈', icon: 'home' },
              { key: 'benefit', label: '혜택', icon: 'gift' },
              { key: 'pay', label: '결제', icon: 'qr' },
              { key: 'invest', label: '투자', icon: 'chart' },
              { key: 'all', label: '전체', icon: 'dots' },
            ]} />
          </div>
        )}
        {toast && (
          <div style={{ position: 'absolute', left: 20, right: 20, bottom: 86, zIndex: 20, display: 'flex', justifyContent: 'center' }}>
            <div style={{ background: 'rgba(31,38,48,0.95)', color: '#fff', borderRadius: 14, padding: '14px 18px', fontSize: 14, fontWeight: 600, boxShadow: 'var(--shadow-float)', display: 'flex', gap: 8, alignItems: 'center' }}>
              <Icon name="check" size={20} color="var(--blue-300)" /> 송금이 완료됐어요
            </div>
          </div>
        )}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
